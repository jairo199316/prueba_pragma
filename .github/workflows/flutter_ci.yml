name: Flutter CI

on:
  push:
    branches: [ "main" ]   # 👈 corre cuando haces push a main
  pull_request:
    branches: [ "main" ]   # 👈 corre cuando alguien abre PR hacia main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: ⚡️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'   # 👈 pon la versión que usas (lo vi en tu contexto)

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze project
        run: flutter analyze

      - name: ✅ Run tests
        run: flutter test

      - name: 📦 Build APK
        run: flutter build apk --release

      - name: 💾 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
